name: CDK plan

on:
  pull_request:
    branches: [main]
    paths:
      - "cdk/**"
      - "website/**"
      - "projects/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: cdk-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cdk/package-lock.json

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::942960194803:role/github-actions-portfolio-cdk-plan
          aws-region: us-east-1

      - name: cdk diff
        run: |
          npx cdk diff --all 2>&1 | tee /tmp/cdk-diff.txt || true

      - name: Comment diff on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('/tmp/cdk-diff.txt', 'utf8').slice(0, 60000);
            const body = `### CDK diff\n<details><summary>Show diff</summary>\n\n\`\`\`\n${diff}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('### CDK diff'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
