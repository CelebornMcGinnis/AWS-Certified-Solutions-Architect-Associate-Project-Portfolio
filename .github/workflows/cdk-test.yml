name: CDK unit tests

on:
  pull_request:
    branches: [main]
    paths:
      - "cdk/**"
      - "projects/**"
      - ".github/workflows/cdk-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cdk/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
